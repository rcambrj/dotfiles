apiVersion: v1
kind: PersistentVolume
metadata:
  name: glusterfs-loki
  labels:
    app.kubernetes.io/name: loki
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  local:
    path: /data/loki
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: gluster-volume-mount/configured
          operator: In
          values:
          - "true"
        - key: gluster-volume-mount/ready
          operator: In
          values:
          - "true"
