apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  labels:
    app: changedetection
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
    spec:
      nodeSelector:
        gluster-volume-mount/ready: "true"
      securityContext:
        runAsUser: 12443
        runAsGroup: 12443
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: datastore
        hostPath:
          path: /data/changedetection
      containers:
      - name: changedetection
        # https://github.com/dgtlmoon/changedetection.io/releases
        image: ghcr.io/dgtlmoon/changedetection.io:0.60.8
        env:
        - name: BASE_URL
          value: https://changedetection.home.cambridge.me
        - name: FETCH_WORKERS
          value: "1"
        - name: PLAYWRIGHT_DRIVER_URL
          value: ws://sockpuppetbrowser:3000
        - name: TZ
          value: Europe/Amsterdam
        - name: USE_X_SETTINGS
          value: "1"
        volumeMounts:
        - name: datastore
          mountPath: /datastore
        ports:
        - name: http
          containerPort: 5000
        startupProbe:
          tcpSocket:
            port: http
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: http
        livenessProbe:
          tcpSocket:
            port: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection
spec:
  selector:
    app: changedetection
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sockpuppetbrowser
  labels:
    app: sockpuppetbrowser
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: sockpuppetbrowser
  template:
    metadata:
      labels:
        app: sockpuppetbrowser
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: changedetection
            topologyKey: kubernetes.io/hostname
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: sockpuppetbrowser
        # https://github.com/dgtlmoon/sockpuppetbrowser/releases
        image: dgtlmoon/sockpuppetbrowser:0.0.3
        env:
        - name: MAX_CONCURRENT_CHROME_PROCESSES
          value: "1"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - name: cdp
          containerPort: 3000
        - name: stats
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /stats
            port: stats
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /stats
            port: stats
        livenessProbe:
          httpGet:
            path: /stats
            port: stats
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: sockpuppetbrowser
spec:
  selector:
    app: sockpuppetbrowser
  ports:
  - name: cdp
    protocol: TCP
    port: 3000
    targetPort: cdp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changedetection
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: traefik-oauth2-proxy-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
      - "changedetection.home.cambridge.me"
    secretName: changedetection-home-cambridge-me-tls
  rules:
  - host: changedetection.home.cambridge.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: changedetection
            port:
              name: http
