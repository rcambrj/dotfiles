{{- range .Values.speakers }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: google-home-volume-{{ .name }}
spec:
  schedule: "0 1 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: script
            configMap:
              name: google-home-volume
          - name: tmp
            emptyDir: {}
          - name: dependencies
            hostPath:
              path: /tmp/change_volume_pychromecast
              type: DirectoryOrCreate
          initContainers:
          - name: prepare-dependencies
            image: busybox:1.37.0
            command: ["/bin/sh", "-ec"]
            args:
            - mkdir -p /deps && chown 65532:65532 /deps
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
                add:
                - CHOWN
            volumeMounts:
            - name: dependencies
              mountPath: /deps
          containers:
          - name: set-volume
            image: python:3.13-slim
            command: ["/bin/sh", "-ec"]
            args:
            - |
              cache=/deps/pychromecast-13.1.0
              ready="$cache/.ready"
              lock=/deps/.install.lock
              if [ ! -f "$ready" ]; then
                while ! mkdir "$lock" 2>/dev/null; do
                  [ -f "$ready" ] && break
                  sleep 1
                done
                if [ ! -f "$ready" ]; then
                  trap 'rmdir "$lock"' 0
                  python -m pip install --disable-pip-version-check --no-cache-dir \
                    --target "$cache" "PyChromecast==13.1.0"
                  touch "$ready"
                  rmdir "$lock"
                  trap - 0
                fi
              fi
              exec python /app/change_volume.py
            env:
            - name: SPEAKER_NAME
              value: {{ .friendlyName | quote }}
            - name: VOLUME_LEVEL
              value: {{ .volume | quote }}
            - name: PYTHONPATH
              value: /deps/pychromecast-13.1.0
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: dependencies
              mountPath: /deps
{{- end }}
