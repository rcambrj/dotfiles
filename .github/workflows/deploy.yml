name: Deploy to cloud machine

on:
  workflow_dispatch:
    inputs:
      MACHINE_NAME:
        type: choice
        description: Machine
        required: true
        options:
          - orange

jobs:
  deploy:
    name: "Deploy: ${{ inputs.MACHINE_NAME }}"
    runs-on: ubuntu-latest
    env:
        MACHINE_SSH_STRING: nixos@${{inputs.MACHINE_NAME}}.cambridge.me
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
          extra_nix_config: |
            system-features = kvm
            extra-platforms = aarch64-linux
            extra-substituters = https://nix-community.cachix.org https://numtide.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE

      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # TODO: set host keys and consume here
      - name: Test SSH connection
        run: ssh -o StrictHostKeyChecking=no -v ${{env.MACHINE_SSH_STRING}} exit

      - name: Deploy to cloud machine
        run: |
          NIX_SSHOPTS="-o StrictHostKeyChecking=no" nix run nixpkgs#nixos-rebuild switch -- \
          --flake .#${{inputs.MACHINE_NAME}} \
          --build-host ${{env.MACHINE_SSH_STRING}} \
          --target-host ${{env.MACHINE_SSH_STRING}} \
          --use-remote-sudo
